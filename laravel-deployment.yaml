apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: laravel-app
  template:
    metadata:
      labels:
        app: laravel-app
    spec:
      containers:
        - name: web
          image: php:8.2-apache
          ports:
            - containerPort: 8080
            - containerPort: 22
          volumeMounts:
            - mountPath: /var/www/html
              name: web-data
          command: ["/bin/sh", "-c"]
          args:
            - |
              apt update && \
              apt install -y unzip git nginx openssh-server php-mysql php-xml php-curl php-mbstring php-bcmath && \
              git clone https://github.com/yourusername/your-laravel-project.git /var/www/html && \
              apache2-foreground
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_DATABASE
              value: "theary-db"
            - name: MYSQL_ROOT_PASSWORD
              value: "Hello@123"
          ports:
            - containerPort: 3306
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: mysql-data
      volumes:
        - name: web-data
          emptyDir: {}
        - name: mysql-data
          emptyDir: {}
